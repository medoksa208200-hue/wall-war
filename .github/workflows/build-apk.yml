name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - shell: bash
        run: |
          set -o pipefail
          (npx cap sync android) 2>&1 | tee /tmp/log.txt || { grep -iE "error|fail|wrong|exception|could not|cannot" /tmp/log.txt | tail -25 | sed 's/^/::error::/'; tail -15 /tmp/log.txt | sed 's/^/::error::/'; exit 1; }
      - run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - shell: bash
        run: |
          set -o pipefail
          (cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon) 2>&1 | tee /tmp/log.txt || { grep -iE "error|fail|wrong|exception|could not|cannot" /tmp/log.txt | tail -25 | sed 's/^/::error::/'; tail -15 /tmp/log.txt | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wall-war-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk wall-war.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest wall-war.apk --title "حرب السور — آخر نسخة" --notes "نزّل wall-war.apk على الموبايل وسطّبه." --latest
